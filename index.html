<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die Lernfabrik - Willkommen</title>

    <!-- Google Fonts (Urbanist for headings, Inter for body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Urbanist:wght@600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Your Custom Stylesheet (for fonts, colors, etc.) -->
    <link rel="stylesheet" href="./assets/css/custom.css">
    
    <style>
        /* A little extra style to ensure the spinner is the brand color */
        .loader-spinner {
            border-top-color: var(--color-primary);
        }
    </style>
</head>
<body class="bg-gray-50">

    <!-- 
      This is a full-screen container that uses Flexbox to arrange content.
      The <main> section grows to push the <footer> to the bottom.
    -->
    <div class="flex flex-col min-h-screen">
        
        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col items-center justify-center text-center p-8">

            <!-- Logo -->
            <img src="./assets/images/Lernfabrik_Logo.png" alt="Die Lernfabrik Logo" class="h-20 w-auto mb-10">

            <!-- Main Headline -->
            <h1 class="text-5xl font-bold text-gray-800">
                Willkommen bei der Lernfabrik
            </h1>

            <!-- Subtitle -->
            <p class="mt-4 text-lg text-gray-600 max-w-md">
                Ihre interaktive Lernumgebung für industrielle Prozesse.
            </p>

            <!-- Decorative Image -->
            <div class="my-12 w-full max-w-sm h-64 bg-cover bg-center rounded-lg shadow-xl" style="background-image: url('./assets/images/deco_image.png');">
            </div>

            <!-- Status Indicator (for your auto-triggers) -->
            <div class="flex items-center justify-center space-x-4 text-gray-500">
                <div class="loader-spinner w-8 h-8 border-4 border-gray-200 border-solid rounded-full animate-spin"></div>
                <span class="text-lg">Place an object to start the learn station</span>
            </div>

        </main>

        <!-- Footer -->
        <footer class="w-full py-6 text-center">
            <img src="./assets/images/Lernfabrik_Logo_minimal.png" alt="Die Lernfabrik Logo" class="h-10 w-auto mx-auto">
        </footer>

    </div>

</body>
</html>
